<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Habit OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--good:#16a34a;--danger:#dc2626;--shadow:0 8px 28px rgba(17,24,39,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:760px;margin:auto;padding:18px 14px 88px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:24px;font-weight:800}.sub{font-size:13px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10}
.nav button{border:0;background:none;padding:12px 18px;color:var(--muted);font-weight:700}.nav button.active{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:var(--shadow)}
.hero{background:#111827;color:white;border:0}.hero .sub{color:#cbd5e1}.hero h1{font-size:28px;margin:4px 0}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}
.progress{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-top:10px}.progress>i{display:block;height:100%;background:var(--accent);border-radius:20px}
.habit{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.habit:last-child{border-bottom:0}.habit-info{flex:1}.habit-name{font-weight:750}.habit-meta{font-size:12px;color:var(--muted);margin-top:3px}
.check{width:48px;height:48px;border-radius:15px;border:2px solid #d1d5db;background:#fff;font-size:23px;cursor:pointer}.check.done{background:#dcfce7;border-color:#86efac;color:#15803d}
button,.input{font:inherit}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:750;cursor:pointer;background:#eef2ff;color:#3730a3}.btn.primary{background:var(--accent);color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}
.input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:8px 2px;text-align:center;border-radius:10px;font-size:12px;background:#f3f4f6}.day.done{background:#bbf7d0;color:#166534}.day.today{outline:2px solid var(--accent)}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f8fafc;border-radius:14px;padding:14px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.section-title{font-size:18px;font-weight:800;margin:22px 2px 8px}.muted{color:var(--muted)}.empty{text-align:center;padding:28px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:22px 22px 0 0;padding:20px}.sheet h2{margin-top:0}
textarea{min-height:80px;resize:vertical}.small{font-size:12px}
@media(min-width:700px){.nav{position:static;border:0;background:transparent;margin:0 auto 10px;max-width:760px}.app{padding-bottom:20px}.nav button{border-radius:10px}.modal{align-items:center}.sheet{max-width:480px;border-radius:22px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="habitOS_v1";
const today=()=>new Date().toISOString().slice(0,10);
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 habits:[
  {id:1,name:"Study",target:1},
  {id:2,name:"Exercise / walk",target:1},
  {id:3,name:"Read / revise",target:1},
  {id:4,name:"Sleep on time",target:1}
 ],
 logs:{}, reflections:{}, view:"today"
};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function iso(d){return d.toISOString().slice(0,10)}
function isDone(h,d=today()){return !!db.logs[d]?.[h.id]}
function toggle(h){let d=today();db.logs[d]??={};db.logs[d][h.id]=!db.logs[d][h.id];save();render()}
function streak(h){
 let n=0,d=new Date();
 while(isDone(h,iso(d))){n++;d.setDate(d.getDate()-1)}
 return n
}
function bestStreak(h){
 let best=0,n=0;
 const days=Object.keys(db.logs).sort();
 for(const d of days){if(isDone(h,d)){n++;best=Math.max(best,n)}else n=0}
 return best
}
function monthDays(){let now=new Date(), y=now.getFullYear(),m=now.getMonth();return new Date(y,m+1,0).getDate()}
function monthDone(h){let n=0,days=monthDays();for(let i=1;i<=days;i++){let d=new Date();d.setDate(i);if(isDone(h,iso(d)))n++}return n}
function overall(){let total=0,done=0;for(let h of db.habits){total+=monthDays()*h.target;done+=monthDone(h)}return total?Math.round(done/total*100):0}
function render(){
 document.getElementById("app").innerHTML=`
 <div class="app">
  <div class="top"><div><div class="brand">Habit OS</div><div class="sub">${new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})}</div></div>
  <button class="btn" onclick="openSettings()">⚙</button></div>
  ${db.view==="today"?todayPage():db.view==="stats"?statsPage():calendarPage()}
 </div>
 <div class="nav">
  <button class="${db.view==='today'?'active':''}" onclick="setView('today')">✓ Today</button>
  <button class="${db.view==='calendar'?'active':''}" onclick="setView('calendar')">▦ Calendar</button>
  <button class="${db.view==='stats'?'active':''}" onclick="setView('stats')">◔ Progress</button>
 </div>
 <div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"></div>`;
}
function setView(v){db.view=v;save();render()}
function todayPage(){
 let done=db.habits.filter(h=>isDone(h)).length,pct=db.habits.length?Math.round(done/db.habits.length*100):0;
 return `<div class="card hero"><div class="sub">TODAY</div><h1>${done}/${db.habits.length} completed</h1><div class="progress"><i style="width:${pct}%"></i></div><div class="sub" style="margin-top:8px">${pct}% done today</div></div>
 <div class="section-title">Your habits</div>
 <div class="card">${db.habits.length?db.habits.map(h=>`<div class="habit"><button class="check ${isDone(h)?'done':''}" onclick="toggle(db.habits.find(x=>x.id===${h.id}))">${isDone(h)?'✓':'○'}</button><div class="habit-info"><div class="habit-name">${esc(h.name)}</div><div class="habit-meta">🔥 ${streak(h)} day streak · Best ${bestStreak(h)}</div></div></div>`).join(""):`<div class="empty">No habits yet. Add your first one.</div>`}</div>
 <button class="btn primary" style="width:100%" onclick="openAdd()">＋ Add habit</button>
 <div class="section-title">Quick reflection</div>
 ${reflectionCard()}`;
}
function reflectionCard(){let r=db.reflections[today()]||{};return `<div class="card"><div class="small muted">How was today?</div><div class="row" style="margin:10px 0">${[1,2,3,4,5].map(x=>`<button class="btn" onclick="setMood(${x})">${x}</button>`).join("")}</div><input class="input" placeholder="Screen time (e.g. 3.5 hours)" value="${esc(r.screen||'')}" onchange="setReflection('screen',this.value)"><textarea class="input" style="margin-top:10px" placeholder="Biggest win today..." onchange="setReflection('win',this.value)">${esc(r.win||'')}</textarea><textarea class="input" style="margin-top:10px" placeholder="Tomorrow's priority..." onchange="setReflection('priority',this.value)">${esc(r.priority||'')}</textarea></div>`}
function setMood(x){db.reflections[today()]??={};db.reflections[today()].mood=x;save();render()}
function setReflection(k,v){db.reflections[today()]??={};db.reflections[today()][k]=v;save()}
function statsPage(){return `<div class="card"><div class="sub">THIS MONTH</div><h1>${overall()}%</h1><div class="progress"><i style="width:${overall()}%"></i></div></div>
<div class="statgrid">${[
["Habits",db.habits.length],["Completed",db.habits.reduce((a,h)=>a+monthDone(h),0)],["Best streak",Math.max(0,...db.habits.map(bestStreak))+" days"],["Days logged",Object.keys(db.logs).length]
].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>
<div class="section-title">Habit performance</div><div class="card">${db.habits.map(h=>{let d=monthDone(h),p=Math.round(d/monthDays()*100);return `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row between"><b>${esc(h.name)}</b><span>${d}/${monthDays()} · ${p}%</span></div><div class="progress"><i style="width:${p}%"></i></div></div>`}).join("")}</div>`}
function calendarPage(){return `<div class="card"><div class="sub">MONTHLY CALENDAR</div><h2>${new Date().toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2><div class="small muted">Tap a habit below, then tap any day to change its status.</div></div>
${db.habits.map(h=>{let days=monthDays();return `<div class="card"><div class="row between"><b>${esc(h.name)}</b><span class="small">${monthDone(h)}/${days}</span></div><div class="grid" style="margin-top:10px">${Array.from({length:days},(_,i)=>{let d=new Date();d.setDate(i+1),s=iso(d);return `<button class="day ${isDone(h,s)?'done':''} ${s===today()?'today':''}" onclick="toggleDate(${h.id},'${s}')">${i+1}</button>`}).join("")}</div></div>`}).join("")}
<button class="btn primary" style="width:100%" onclick="openAdd()">＋ Add habit</button>`}
function toggleDate(id,d){db.logs[d]??={};db.logs[d][id]=!db.logs[d][id];save();render()}
function openAdd(){document.getElementById("modal").className="modal show";document.getElementById("modal").innerHTML=`<div class="sheet"><h2>Add a habit</h2><input id="newHabit" class="input" placeholder="e.g. Drink water"><div class="row" style="margin-top:14px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="addHabit()">Add habit</button></div></div>`}
function addHabit(){let n=document.getElementById("newHabit").value.trim();if(!n)return;if(db.habits.length>=30)return alert("Keep it to 30 habits or fewer so the tracker stays usable.");db.habits.push({id:Date.now(),name:n,target:1});save();closeModal();render()}
function openSettings(){document.getElementById("modal").className="modal show";document.getElementById("modal").innerHTML=`<div class="sheet"><h2>Manage habits</h2>${db.habits.map(h=>`<div class="row" style="margin:8px 0"><input class="input" value="${esc(h.name)}" onchange="renameHabit(${h.id},this.value)"><button class="btn danger" onclick="deleteHabit(${h.id})">Delete</button></div>`).join("")}<hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button class="btn" onclick="exportData()">Export my data</button> <button class="btn danger" onclick="resetData()">Reset everything</button><div class="small muted" style="margin-top:14px">Your data is stored locally in this browser. Export a backup before clearing browser data.</div><button class="btn primary" style="width:100%;margin-top:16px" onclick="closeModal()">Done</button></div>`}
function renameHabit(id,v){let h=db.habits.find(x=>x.id===id);if(h&&v.trim()){h.name=v.trim();save()}}
function deleteHabit(id){if(confirm("Delete this habit? Its future tracking will stop, but old log entries remain in your local data.")){db.habits=db.habits.filter(h=>h.id!==id);save();openSettings()}}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="habit-os-backup.json";a.click()}
function resetData(){if(confirm("This permanently clears the tracker on this device. Continue?")){localStorage.removeItem(KEY);location.reload()}}
function closeModal(){document.getElementById("modal").className="modal";document.getElementById("modal").innerHTML=""}
render();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js')); }
</script>
</body>
</html>
